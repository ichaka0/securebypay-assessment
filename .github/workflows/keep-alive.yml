name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        env:
          PING_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "KEEP_ALIVE_URL secret is not set" >&2
            exit 1
          fi
          # Render cold starts can take ~a minute, so allow retries.
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors "$PING_URL"
